apiVersion: v1
kind: Service
metadata:
  name: smartassist-api-service
  namespace: default
spec:
  type: NodePort #/ ClusterIP / LoadBalancer(Only For Cloud Deployment on AWS, Azure, GCP, etc)
  selector:
    app: smartassist-api #Deployment Name to send the traffic to
  ports:
  - port: 8000 #Host Port
    targetPort: 8000 #Container Port
    nodePort: 30080 #Service will listen on this port